name: Build Aero (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Aero-windows.zip
      # Create the release once, then only replace its files: this never
      # edits or moves the tag (which this repo's token isn't allowed to do).
      - name: Publish on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo ${{ github.repository }} >/dev/null 2>&1 ||
            gh release create latest --repo ${{ github.repository }} --prerelease \
              --title "Aero for Windows (latest)" --notes "Built automatically. Download Aero-windows.zip."
          gh release upload latest Aero-windows.zip --clobber --repo ${{ github.repository }}
