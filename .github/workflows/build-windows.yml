name: Build Aero (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Aero-windows.zip
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aero for Windows (latest)
          make_latest: true
          body: Built automatically from ${{ github.sha }}. Download Aero-windows.zip, Extract All, run aero.exe. Aero updates itself after that.
          files: Aero-windows.zip
