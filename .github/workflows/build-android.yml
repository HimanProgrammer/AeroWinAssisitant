name: Build Aero (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Phone-only (arm64) APK: small, downloads reliably on mobile data.
      - run: flutter build apk --release --split-per-abi
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk AeroAssistant.apk
      - run: ls -la AeroAssistant.apk
      # Create the release once, then only replace its files: this never
      # edits or moves the tag (which this repo's token isn't allowed to do).
      - name: Publish on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo ${{ github.repository }} >/dev/null 2>&1 ||
            gh release create android-latest --repo ${{ github.repository }} --prerelease \
              --title "Aero for Android (latest)" --notes "Built automatically. Download AeroAssistant.apk."
          gh release upload android-latest AeroAssistant.apk --clobber --repo ${{ github.repository }}
