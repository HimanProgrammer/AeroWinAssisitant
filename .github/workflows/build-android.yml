name: Build Aero (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Phone-only (arm64) APK: small, downloads reliably on mobile data.
      - run: flutter build apk --release --split-per-abi
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk AeroAssistant.apk
      - run: ls -la AeroAssistant.apk
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Aero for Android (latest)
          prerelease: true
          make_latest: false
          body: Built automatically from ${{ github.sha }}. Open on your phone, tap AeroAssistant.apk, then Install.
          files: AeroAssistant.apk
